<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0E0E0E" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7931E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F7931E" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg)" />

  <!-- Grid lines -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

  <!-- Browser Chrome Window -->
  <g transform="translate(60, 45)">
    <!-- Window Body -->
    <rect width="480" height="270" rx="16" fill="#121212" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect width="480" height="36" rx="16" fill="#1C1C1C" />
    <rect y="24" width="480" height="12" fill="#1C1C1C" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" />
    <circle cx="35" cy="18" r="4.5" fill="#F59E0B" />
    <circle cx="50" cy="18" r="4.5" fill="#10B981" />
    
    <!-- URL pill -->
    <rect x="80" y="9" width="320" height="18" rx="9" fill="#0D0D0D" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="240" y="22" fill="#888888" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">shahid-portfolio.vercel.app</text>

    <!-- Mini Navbar inside mockup -->
    <rect x="140" y="52" width="200" height="20" rx="10" fill="#181818" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="152" cy="62" r="3" fill="#F7931E" />
    <line x1="165" y1="62" x2="200" y2="62" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="210" y1="62" x2="240" y2="62" stroke="#777777" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="62" x2="280" y2="62" stroke="#777777" stroke-width="2" stroke-linecap="round" />
    <rect x="300" y="56" width="32" height="12" rx="6" fill="#F7931E" />

    <!-- Mockup Hero Left -->
    <rect x="40" y="95" width="80" height="14" rx="4" fill="#F7931E" />
    <text x="44" y="105" fill="#000000" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">NEXT.JS 14</text>
    
    <text x="40" y="135" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Building Intelligent</text>
    <text x="40" y="155" fill="#F7931E" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Digital Experiences</text>
    
    <rect x="40" y="172" width="180" height="6" rx="3" fill="#555555" />
    <rect x="40" y="184" width="140" height="6" rx="3" fill="#444444" />

    <!-- Buttons -->
    <rect x="40" y="205" width="65" height="24" rx="12" fill="#F7931E" />
    <rect x="115" y="205" width="60" height="24" rx="12" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <!-- Mockup Hero Right (Card) -->
    <rect x="290" y="90" width="145" height="145" rx="20" fill="#202020" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="362" cy="150" r="36" fill="#F7931E" opacity="0.2" />
    <circle cx="362" cy="140" r="22" fill="#F7931E" opacity="0.8" />
    <path d="M 330 215 C 330 180, 395 180, 395 215 Z" fill="#333333" />
    
    <!-- Chat pill -->
    <rect x="275" y="82" width="60" height="16" rx="8" fill="#FFFFFF" />
    <text x="305" y="93" fill="#000000" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Hi, I'm Shahid</text>
    
    <!-- Year 1 badge -->
    <rect x="350" y="215" width="85" height="18" rx="9" fill="#FFFFFF" />
    <text x="392" y="227" fill="#000000" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">B.Tech CSE (AI)</text>
  </g>
</svg>
