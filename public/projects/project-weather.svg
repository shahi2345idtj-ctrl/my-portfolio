<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A24" />
      <stop offset="100%" stop-color="#090E14" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg)" />

  <!-- App Window -->
  <g transform="translate(60, 45)">
    <rect width="480" height="270" rx="16" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect width="480" height="36" rx="16" fill="#1F2937" />
    <rect y="24" width="480" height="12" fill="#1F2937" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" />
    <circle cx="35" cy="18" r="4.5" fill="#F59E0B" />
    <circle cx="50" cy="18" r="4.5" fill="#10B981" />
    <text x="75" y="22" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SkyCast · Kerala Real-Time Weather &amp; Air Quality</text>

    <!-- Main Weather Display -->
    <g transform="translate(30, 60)">
      <text x="0" y="24" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Thrissur, Kerala</text>
      <text x="0" y="42" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Humidity: 78% · Wind: 12 km/h · AQI: 42 (Good)</text>

      <!-- Big Temp -->
      <text x="0" y="115" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="64" font-weight="bold">29°C</text>
      <text x="145" y="80" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Partly Cloudy</text>

      <!-- Forecast Pills -->
      <g transform="translate(0, 140)">
        <rect width="70" height="42" rx="8" fill="#1F2937" stroke="rgba(255,255,255,0.06)" />
        <text x="35" y="18" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Mon</text>
        <text x="35" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">30°</text>

        <g transform="translate(78, 0)">
          <rect width="70" height="42" rx="8" fill="#1F2937" stroke="rgba(255,255,255,0.06)" />
          <text x="35" y="18" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Tue</text>
          <text x="35" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">28°</text>
        </g>

        <g transform="translate(156, 0)">
          <rect width="70" height="42" rx="8" fill="#1F2937" stroke="rgba(255,255,255,0.06)" />
          <text x="35" y="18" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Wed</text>
          <text x="35" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">31°</text>
        </g>
      </g>
    </g>

    <!-- Weather Illustration / Chart Right -->
    <g transform="translate(290, 60)">
      <rect width="160" height="180" rx="12" fill="#182234" stroke="rgba(56,189,248,0.2)" stroke-width="1" />
      <text x="16" y="24" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Air Quality Index (AQI)</text>
      
      <!-- Circular Gauge -->
      <circle cx="80" cy="95" r="42" fill="none" stroke="#334155" stroke-width="8" />
      <circle cx="80" cy="95" r="42" fill="none" stroke="#10B981" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="65" stroke-linecap="round" />
      <text x="80" y="94" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">42</text>
      <text x="80" y="110" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">GOOD</text>

      <text x="80" y="160" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Safe outdoor air quality</text>
    </g>
  </g>
</svg>
