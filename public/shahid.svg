<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="60%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0D0D0D" />
    </linearGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F7931E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F7931E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" rx="28" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="140" fill="url(#orangeGlow)" />

  <!-- Grid mesh background -->
  <path d="M 0 100 H 400 M 0 200 H 400 M 0 300 H 400 M 0 400 H 400" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M 100 0 V 500 M 200 0 V 500 M 300 0 V 500" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Stylized Student Figure -->
  <g transform="translate(0, 40)">
    <!-- Shoulders / Torso -->
    <path d="M 100 420 C 100 330, 140 310, 200 310 C 260 310, 300 330, 300 420 Z" fill="#202020" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
    <!-- Shirt Collar & Tie / Accent -->
    <path d="M 175 310 L 200 355 L 225 310 Z" fill="#F7931E" opacity="0.9" />
    <path d="M 196 355 L 204 355 L 208 420 L 192 420 Z" fill="#E07D0C" />

    <!-- Head & Neck -->
    <rect x="182" y="250" width="36" height="65" rx="10" fill="#E2A176" />
    <!-- Face -->
    <ellipse cx="200" cy="200" rx="60" ry="72" fill="#F5B892" />
    
    <!-- Hair Modern Cut -->
    <path d="M 135 185 C 135 110, 160 100, 200 100 C 240 100, 265 110, 265 185 C 255 130, 230 135, 200 135 C 170 135, 145 130, 135 185 Z" fill="#1C1815" />
    
    <!-- Glasses -->
    <rect x="155" y="180" width="35" height="24" rx="8" fill="none" stroke="#F7931E" stroke-width="3" />
    <rect x="210" y="180" width="35" height="24" rx="8" fill="none" stroke="#F7931E" stroke-width="3" />
    <line x1="190" y1="192" x2="210" y2="192" stroke="#F7931E" stroke-width="3" />
    <line x1="145" y1="188" x2="155" y2="188" stroke="#F7931E" stroke-width="3" />
    <line x1="245" y1="188" x2="255" y2="188" stroke="#F7931E" stroke-width="3" />

    <!-- Eyes & Smile -->
    <circle cx="172" cy="192" r="3" fill="#1C1815" />
    <circle cx="228" cy="192" r="3" fill="#1C1815" />
    <path d="M 188 232 Q 200 244 212 232" fill="none" stroke="#B06540" stroke-width="3" stroke-linecap="round" />

    <!-- Headphone Band -->
    <path d="M 130 190 C 130 110, 270 110, 270 190" fill="none" stroke="#333333" stroke-width="6" stroke-linecap="round" />
    <rect x="124" y="175" width="14" height="35" rx="7" fill="#F7931E" />
    <rect x="262" y="175" width="14" height="35" rx="7" fill="#F7931E" />
  </g>

  <!-- Bottom text hint -->
  <text x="200" y="475" text-anchor="middle" fill="#666666" font-family="system-ui, sans-serif" font-size="12" font-weight="500">
    Placeholder · Replace with /public/shahid.jpg
  </text>
</svg>

